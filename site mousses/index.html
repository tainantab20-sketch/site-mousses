<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doces do Tainan</title>

    <style>
       
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        header {
            background-color: #ff4d6d;
            color: white;
            text-align: center;
            padding: 20px;
        }

        nav {
            background-color: #333;
            text-align: center;
            padding: 10px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
        }

        .banner {
            background-color: #ffd6de;
            text-align: center;
            padding: 60px 20px;
        }

        .produtos {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 30px;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            width: 250px;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            text-align: center;
        }

        .card img {
    width: 100%;
    border-radius: 10px;
}

.torta {
   .torta 
    width: 100%;
    height: 390px;
    object-fit: cover;
}
         

        .botao {
            display: inline-block;
            background-color: #ff4d6d;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 10px;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 16px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>🍫 Doces do Tainan</h1>
        <p>Os melhores mousses da região</p>
    </header>

    <nav>
        <a href="x">Início</a>
        <a href="#">Produtos</a>
        <a href="https://whatsapp.com/51998823882">Contato</a>
    </nav>

    <section class="banner">
        <h2>Bem-vindo à nossa loja!</h2>
        <p>Doces feitos com carinho e ingredientes de qualidade.</p>
    </section>

    <section class="produtos">

        <div class="card">
            <img src="mouse de morango.jpeg" alt="Mousse de Morango">
            <h3>Mousse de Morango</h3>
            <p>R$ 8,,00</p>
            <a href="#" class="botao">Comprar</a>
        </div>

        <div class="card">
            <img src="mouse de chocolate.jpeg" alt="Mousse de Chocolate">
            <h3>Mousse de Chocolate</h3>
            <p>R$ 8,00</p>
            <a href="#" class="botao">Comprar</a>
        </div>

          <div class="card">
            <img src="torta de limao1.jpeg" alt="Torta de limao" class="torta">
            <h3>torta</h3>
            <p>R$ 10,00</p>
            <a href="#" class="botao">Comprar</a>

           

        </div>

    </section>

    <footer>
        <p>© 2026 Doces do Tainan</p>
    </footer>

</body>
</html>
